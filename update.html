<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Rate Admin</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f2f4f7;
padding:25px;
}

.container{
max-width:750px;
margin:auto;
display:none;
}

.lock-screen{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
margin:-25px;
padding:25px;
color:#f5372e;
}

.keypad-wrap{
width:min(620px,100%);
}

.pin-view{
height:48px;
margin-bottom:24px;
text-align:center;
font-size:30px;
letter-spacing:10px;
color:#111;
}

.keypad-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:26px;
}

.keypad-key{
min-height:120px;
border:none;
background:#fff;
color:#f5372e;
font-size:112px;
font-weight:900;
line-height:1;
text-shadow:-2px -2px 0 #fff,2px 2px 0 #cfd4d8;
cursor:pointer;
}

.keypad-tool{
min-height:54px;
border:1px solid #ddd;
border-radius:8px;
background:#f7f7f7;
color:#111;
font-size:16px;
cursor:pointer;
}

.card{
background:#fff;
border-radius:12px;
padding:25px;
box-shadow:0 3px 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
margin-bottom:25px;
color:#333;
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-bottom:25px;
flex-wrap:wrap;
}

.topbar h2{
margin-bottom:0;
text-align:left;
}

.rate-targets{
display:flex;
gap:8px;
margin-bottom:18px;
}

.rate-targets button{
flex:1;
background:#e8ebef;
color:#333;
}

.rate-targets button.active{
background:#1976D2;
color:#fff;
}

.rate-note{
margin:-8px 0 18px;
color:#606975;
font-size:14px;
line-height:1.5;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
gap:20px;
}

.row label{
font-weight:bold;
width:180px;
}

.row input{
flex:1;
padding:10px;
font-size:16px;
border:1px solid #ccc;
border-radius:6px;
}

.readonly{
background:#ececec;
}

.buttons{
display:flex;
justify-content:center;
gap:10px;
margin-top:25px;
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:6px;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

#calculateBtn{
background:#ff9800;
color:white;
}

#editBtn{
background:#1976D2;
color:white;
}

#updateBtn{
background:#4CAF50;
color:white;
display:none;
}

#cancelBtn{
background:#f44336;
color:white;
display:none;
}

.preview{
margin-top:30px;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.preview h3{
margin-bottom:20px;
}

.preview p{
font-size:18px;
margin-bottom:12px;
}

.loading{
display:none;
text-align:center;
font-size:18px;
margin-top:15px;
color:#1976D2;
}

.success{
display:none;
text-align:center;
font-size:17px;
margin-top:15px;
color:green;
}

.error{
display:none;
text-align:center;
font-size:17px;
margin-top:15px;
color:red;
}

@media(max-width:600px){
body{
padding:12px;
}

.lock-screen{
margin:-12px;
padding:12px;
}

.keypad-grid{
gap:16px;
}

.keypad-key{
min-height:92px;
font-size:82px;
}

.row{
flex-direction:column;
align-items:flex-start;
}

.row label{
width:100%;
}

.row input{
width:100%;
}

.buttons{
flex-wrap:wrap;
}
}

body{background:#f5f6f8;color:#17191d}
.container{max-width:900px;padding:24px 0}
.card{padding:30px;background:#fff;border:1px solid #e1e4e8;border-radius:14px;box-shadow:0 5px 24px rgba(16,24,40,.08)}
.rate-targets{max-width:360px;margin:0 auto 12px}
.rate-targets button{min-height:44px;border:1px solid #d7dce2;font-size:14px}
.rate-targets button.active{background:#183c30;color:#fff;border-color:#183c30}
.rate-note{text-align:center;margin:0 0 20px;font-size:13px}
.topbar{margin-bottom:22px}
.topbar h2{text-align:left;font-size:22px;color:#183c30}
.rate-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 26px}
.rate-fields .row{display:grid;grid-template-columns:minmax(86px,auto) minmax(0,1fr);align-items:center;gap:12px;margin:0;min-width:0}
.rate-fields .row label{width:auto;font-size:15px;line-height:1.3;color:#20242a}
.rate-fields .row input,.association-row input{width:100%;min-width:0;height:54px;padding:10px 12px;border:2px solid #555;border-radius:2px;background:#fff;font-size:21px;font-weight:600;color:#111}
.rate-fields .row input:focus,.association-row input:focus{outline:3px solid #dce9e2;border-color:#183c30}
.rate-fields .row input.readonly{background:#f0f1f2}
.association-row{display:none;margin:22px 0 0}
.association-row label{width:180px;font-weight:bold}
.calculate-row{display:none;margin-top:14px}
.calculate-row button{background:#e9edf0;color:#183c30;font-size:14px}
.meta-row{display:none}
.buttons:not(.calculate-row){justify-content:flex-end;margin-top:25px}
#editBtn{background:#e9edf0;color:#183c30;display:none}
#updateBtn{background:#183c30;color:#fff;min-width:160px;min-height:48px;font-size:16px}
#cancelBtn{background:#f1f2f3;color:#343a40;min-height:48px}
.success,.error,.loading{font-size:14px;font-weight:700}
.success{color:#17834b}
.error{color:#c43c35}
@media(max-width:600px){
body{padding:12px}
.container{padding:12px 0}
.card{padding:20px 16px}
.rate-fields{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
.rate-fields .row{grid-template-columns:minmax(0,1fr);gap:7px;align-content:start}
.rate-fields .row label{font-size:12px;min-height:30px;display:flex;align-items:end}
.rate-fields .row input{height:48px;padding:8px;font-size:18px}
.association-row{gap:8px}
.association-row label{width:auto}
}
</style>
</head>
<body>
<section class="lock-screen" id="lockScreen">
<div class="keypad-wrap">
<div class="pin-view" id="pinView"></div>
<div class="keypad-grid">
<button class="keypad-key" type="button" data-lock-key="1">1</button>
<button class="keypad-key" type="button" data-lock-key="2">2</button>
<button class="keypad-key" type="button" data-lock-key="3">3</button>
<button class="keypad-key" type="button" data-lock-key="4">4</button>
<button class="keypad-key" type="button" data-lock-key="5">5</button>
<button class="keypad-key" type="button" data-lock-key="6">6</button>
<button class="keypad-key" type="button" data-lock-key="7">7</button>
<button class="keypad-key" type="button" data-lock-key="8">8</button>
<button class="keypad-key" type="button" data-lock-key="9">9</button>
<button class="keypad-tool" type="button" data-lock-back>Back</button>
<button class="keypad-key" type="button" data-lock-key="0">0</button>
<button class="keypad-tool" type="button" data-lock-clear>Clear</button>
</div>
</div>
</section>

<div class="container">
<div class="card">
<div class="rate-targets" role="group" aria-label="Rate type">
<button id="todayModeBtn" class="active" type="button">Today Rate</button>
<button id="kgsmaModeBtn" type="button">KGSMA Rate</button>
</div>
<p class="rate-note" id="rateNote">Editing rates/today. This rate is used on every customer's poster.</p>
<div class="topbar">
<h2 id="ratePageTitle">Today Gold Rate Admin</h2>
<button id="editBtn">Edit</button>
</div>

<div class="rate-fields">
<div class="row">
<label>22K 1 Gram</label>
<input type="text" inputmode="numeric" pattern="[0-9]*" id="gold22_1g" disabled>
</div>

<div class="row">
<label>22K 1 Pavan</label>
<input type="text" inputmode="numeric" pattern="[0-9]*" id="gold22_1p" class="readonly" readonly disabled>
</div>

<div class="row">
<label>18K 1 Gram</label>
<input type="text" inputmode="numeric" pattern="[0-9]*" id="gold18_1g" disabled>
</div>

<div class="row">
<label>Silver 1 Gram</label>
<input type="text" inputmode="numeric" pattern="[0-9]*" id="silver_1g" disabled>
</div>
</div>

<div class="row association-row">
<label id="associationRateLabel">KGSMA</label>
<input type="text" inputmode="numeric" pattern="[0-9]*" id="kgsma" disabled>
</div>

<div class="buttons calculate-row">
<button id="calculateBtn" type="button" disabled>Calculate 1 Pavan</button>
</div>

<div class="row meta-row">
<label>Date</label>
<input id="date" class="readonly" readonly>
</div>

<div class="row meta-row">
<label>Time</label>
<input id="time" class="readonly" readonly>
</div>

<div class="row meta-row">
<label>Difference</label>
<input id="diff" class="readonly" readonly>
</div>

<div class="buttons">
<button id="updateBtn">Update</button>
<button id="cancelBtn">Cancel</button>
</div>

<div class="loading" id="loading">Updating...</div>
<div class="success" id="success">Updated Successfully</div>
<div class="error" id="error">Update Failed</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
doc,
getDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyBxnjf4XDfnr4kj6mb-bR_wHW_3ZT0e9BU",
authDomain:"gold-5735f.firebaseapp.com",
projectId:"gold-5735f",
storageBucket:"gold-5735f.firebasestorage.app",
messagingSenderId:"5295731508",
appId:"1:5295731508:web:07d5430da5ebaaf6886b61"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const rateRefs = {
  kgsma: doc(db,"rates","kgsma"),
  today: doc(db,"rates","today")
};
const GRAMS_PER_PAVAN = 8;

let oldData = {};
let pinValue = "";
let activeInput = null;
let activeRateType = "today";
const adminPin = "1994";
const kgsmaRow = document.getElementById("kgsma").closest(".row");
const calculateRow = document.getElementById("calculateBtn").closest(".buttons");

const editable = [
gold22_1g,
gold22_1p,
gold18_1g,
silver_1g,
kgsma
];

function digitsOnly(value){
return String(value || "").replace(/\D/g,"");
}

function renderPin(){
pinView.textContent = "•".repeat(pinValue.length);
}

function unlockPage(){
lockScreen.style.display = "none";
document.querySelector(".container").style.display = "block";
setRateType("today",true);
}

async function setRateType(type,isEditing=true){
activeRateType = type === "today" ? "today" : "kgsma";
const isToday = activeRateType === "today";
kgsmaModeBtn.classList.toggle("active",!isToday);
todayModeBtn.classList.toggle("active",isToday);
ratePageTitle.textContent = isToday ? "Today Gold Rate Admin" : "KGSMA Gold Rate Admin";
rateNote.textContent = isToday
  ? "Editing rates/today. This rate is used on every customer's poster."
  : "Editing the KGSMA rate.";
associationRateLabel.textContent = isToday ? "Association Rate" : "KGSMA";
kgsmaRow.style.display = isToday ? "none" : "flex";
gold22_1p.readOnly = !isToday;
gold22_1p.classList.toggle("readonly",!isToday);
activeInput = null;
setEditMode(isEditing);
success.style.display = "none";
error.style.display = "none";
updateBtn.disabled = true;
await loadData();
updateBtn.disabled = false;
activeInput = null;
setEditMode(isEditing);
}

function handlePinDigit(digit){
if(pinValue.length >= adminPin.length){
pinValue = "";
}

pinValue += digit;
renderPin();

if(pinValue === adminPin){
unlockPage();
return;
}

if(pinValue.length === adminPin.length){
setTimeout(()=>{
pinValue = "";
renderPin();
},250);
}
}

function clearEditableFields(){
editable.forEach((box)=>{
box.value = "";
});

activeInput = gold22_1g;
gold22_1p.value = "";
date.value = "";
time.value = "";
diff.value = "";
preview();
}

function preview(){
// Rate values are shown directly in the editable fields.
}

function setEditMode(isEditing){
editable.forEach((box)=>{
box.disabled = !isEditing;
});
gold22_1p.readOnly = activeRateType !== "today";

calculateBtn.disabled = !isEditing;
calculateRow.style.display = isEditing ? "flex" : "none";
editBtn.style.display = "inline-block";
updateBtn.style.display = isEditing ? "inline-block" : "none";
cancelBtn.style.display = isEditing ? "inline-block" : "none";
updateBtn.textContent = activeRateType === "today" ? "Save Today Rate" : "Save KGSMA Rate";

if(!isEditing) activeInput = null;
}

function todayDate(){
const d = new Date();
const day = String(d.getDate()).padStart(2,"0");
const month = String(d.getMonth() + 1).padStart(2,"0");
const year = d.getFullYear();
return `${day}-${month}-${year}`;
}

function todayIsoDate(){
const d = new Date();
const year = d.getFullYear();
const month = String(d.getMonth() + 1).padStart(2,"0");
const day = String(d.getDate()).padStart(2,"0");
return `${year}-${month}-${day}`;
}

function currentTime(){
return new Date().toLocaleTimeString("en-IN",{
hour:"2-digit",
minute:"2-digit",
hour12:true
});
}

function normalizeDateParts(value){
if(!value){
return null;
}

const parts = String(value).trim().split("-");

if(parts.length !== 3){
return null;
}

if(parts[0].length === 4){
return {
year:parts[0],
month:parts[1].padStart(2,"0"),
day:parts[2].padStart(2,"0")
};
}

return {
year:parts[2],
month:parts[1].padStart(2,"0"),
day:parts[0].padStart(2,"0")
};
}

function isSameRateDate(firstDate,secondDate){
const first = normalizeDateParts(firstDate);
const second = normalizeDateParts(secondDate);

if(!first || !second){
return false;
}

return first.year === second.year
&& first.month === second.month
&& first.day === second.day;
}

function getPreviousDirection(){
const previousDiff = String(oldData.diff || "").trim();

if(previousDiff.startsWith("+")){
return "up";
}

if(previousDiff.startsWith("-")){
return "down";
}

return "";
}

function calculateDiff(){
const isToday = activeRateType === "today";
const newRate = Number(isToday ? gold22_1g.value : gold22_1p.value);
const oldRate = Number(isToday ? oldData.gold22_1g : oldData.gold22_1p) || 0;
const difference = newRate - oldRate;
const sameDate = isSameRateDate(todayDate(), oldData.date);
const previousDirection = getPreviousDirection();

if(isToday){
if(difference > 0) return "+" + difference;
if(difference < 0) return String(difference);
return "0";
}

if(difference > 0){
const prefix = sameDate && previousDirection === "up" ? "++" : "+";
return `${prefix}${Math.abs(difference)}`;
}

if(difference < 0){
const prefix = sameDate && previousDirection === "down" ? "--" : "-";
return `${prefix}${Math.abs(difference)}`;
}

return "0";
}

function resetCalculatedFields(){
if(activeRateType === "kgsma") gold22_1p.value = "";
date.value = "";
time.value = "";
diff.value = "";
preview();
}

function fillCalculatedValues(forcePavan=false){
const gramRate = Number(gold22_1g.value);

if(!gramRate){
resetCalculatedFields();
return;
}

if(activeRateType === "kgsma" || forcePavan || !gold22_1p.value){
gold22_1p.value = gramRate * GRAMS_PER_PAVAN;
}
date.value = activeRateType === "today"
  ? todayIsoDate()
  : todayDate();
time.value = currentTime();
diff.value = calculateDiff();
preview();
}

async function loadData(){
loading.style.display = "block";

try{
const snap = await getDoc(rateRefs[activeRateType]);

if(!snap.exists()){
alert("Document not found");
return;
}

oldData = snap.data();
gold22_1p.value = oldData.gold22_1p || 0;
gold22_1g.value = oldData.gold22_1g || 0;
gold18_1g.value = oldData.gold18_1g || 0;
silver_1g.value = oldData.silver_1g || 0;
kgsma.value = oldData.kgsma || 0;
date.value = oldData.date || "";
time.value = oldData.time || "";
diff.value = oldData.diff || "";
preview();
}
catch(error){
console.log(error);
alert("Loading Failed");
}

loading.style.display = "none";
}

editable.forEach((box)=>{
box.addEventListener("input",()=>{
box.value = digitsOnly(box.value);
if(activeRateType === "today"){
date.value = "";
time.value = "";
diff.value = "";
}
preview();
});

box.addEventListener("focus",()=>{
activeInput = box;
});
});

gold22_1g.addEventListener("input",()=>{
if(activeRateType === "kgsma" && !calculateBtn.disabled){
resetCalculatedFields();
}else if(activeRateType === "today"){
gold22_1p.value = gold22_1g.value
  ? String(Number(gold22_1g.value) * GRAMS_PER_PAVAN)
  : "";
date.value = "";
time.value = "";
diff.value = "";
preview();
}
});

calculateBtn.onclick = () => {
fillCalculatedValues(true);
};

editBtn.onclick = () => {
clearEditableFields();
setEditMode(true);
activeInput = gold22_1g;
gold22_1g.focus();
success.style.display = "none";
error.style.display = "none";
};

cancelBtn.onclick = () => {
gold22_1p.value = oldData.gold22_1p || 0;
gold22_1g.value = oldData.gold22_1g || 0;
gold18_1g.value = oldData.gold18_1g || 0;
silver_1g.value = oldData.silver_1g || 0;
kgsma.value = oldData.kgsma || 0;
date.value = oldData.date || "";
time.value = oldData.time || "";
diff.value = oldData.diff || "";
preview();
setEditMode(false);
};

updateBtn.onclick = async () => {
loading.style.display = "block";
success.style.display = "none";
error.style.display = "none";

try{
if(!gold22_1g.value){
throw new Error("22K 1 Gram is required");
}

if(!gold22_1p.value || !date.value || !time.value || diff.value === ""){
fillCalculatedValues();
}

const payload = {
gold22_1p:Number(gold22_1p.value),
gold22_1g:Number(gold22_1g.value),
gold18_1g:Number(gold18_1g.value),
silver_1g:Number(silver_1g.value),
date:date.value,
time:time.value,
diff:diff.value
};
if(activeRateType === "kgsma"){
payload.kgsma = Number(kgsma.value);
payload.updateCount = Number(oldData.updateCount) || 0;
}
await updateDoc(rateRefs[activeRateType],payload);

await loadData();
setEditMode(false);
success.style.display = "block";

setTimeout(()=>{
success.style.display = "none";
},3000);
}
catch(error){
console.error(error);
error.style.display = "block";

setTimeout(()=>{
error.style.display = "none";
},3000);
}

loading.style.display = "none";
};

setEditMode(false);

kgsmaModeBtn.addEventListener("click",()=>setRateType("kgsma"));
todayModeBtn.addEventListener("click",()=>setRateType("today"));

document.querySelectorAll("[data-lock-key]").forEach((button)=>{
button.addEventListener("click",()=>{
handlePinDigit(button.dataset.lockKey);
});
});

document.querySelector("[data-lock-back]").addEventListener("click",()=>{
pinValue = pinValue.slice(0,-1);
renderPin();
});

document.querySelector("[data-lock-clear]").addEventListener("click",()=>{
pinValue = "";
renderPin();
});

renderPin();
</script>
</body>
</html>
